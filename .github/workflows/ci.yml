name: goldeksa-ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: goldeksa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings 0
      - run: npm run build
      - run: npm test -- --runInBand

  backend-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
      FRONTEND_URL: http://localhost:5174
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run security regression gate
        run: npm run test:security -- --runInBand
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  backend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      E2E_BASE_URL: http://localhost:3011
      E2E_ALLOW_DB_FIXTURES: '1'
      DB_HOST: localhost
      DB_PORT: '55432'
      DB_USERNAME: goldeksa_e2e
      DB_PASSWORD: goldeksa_e2e_only
      DB_DATABASE: goldeksa_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Start isolated PostgreSQL and Redis E2E stack
        run: docker compose -f test/docker-compose.e2e.yml up -d --build
      - name: Wait for API health check
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent "$E2E_BASE_URL/health" | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f test/docker-compose.e2e.yml ps
          docker compose -f test/docker-compose.e2e.yml logs backend
          exit 1
      - name: Run PostgreSQL and Redis E2E suite
        run: npm run test:e2e -- --runInBand
      - name: Tear down isolated E2E stack
        if: always()
        run: docker compose -f test/docker-compose.e2e.yml down -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  ai-service-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: python -m pip install --requirement requirements.txt
      - run: python -m compileall -q .

  compose-config:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: goldeksa-ci
      POSTGRES_DB: goldeksa_ci
      POSTGRES_USER: goldeksa_ci
      POSTGRES_PASSWORD: ci-only-postgres-password
      RABBITMQ_DEFAULT_USER: goldeksa_ci
      RABBITMQ_DEFAULT_PASS: ci-only-rabbitmq-password
      JWT_SECRET: ci-only-jwt-secret-for-config-validation
      FRONTEND_URL: http://localhost:5174
      APP_BASE_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - name: Validate development compose
        run: docker compose config --quiet
      - name: Validate production-like compose
        run: docker compose -f infra/docker-compose.yml config --quiet
      - name: Validate isolated E2E compose
        run: docker compose -f backend/test/docker-compose.e2e.yml config --quiet

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, backend-security, backend-e2e, frontend-build, ai-service-check, compose-config]
    env:
      POSTGRES_DB: goldeksa_ci
      POSTGRES_USER: goldeksa_ci
      POSTGRES_PASSWORD: ci-only-postgres-password
      RABBITMQ_DEFAULT_USER: goldeksa_ci
      RABBITMQ_DEFAULT_PASS: ci-only-rabbitmq-password
      JWT_SECRET: ci-only-jwt-secret-for-config-validation
      FRONTEND_URL: http://localhost:5174
      APP_BASE_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - name: Build development images
        run: docker compose build
