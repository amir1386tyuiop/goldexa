name: goldeksa-ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: goldeksa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings 0
      - run: npm run build
      - run: npm test -- --runInBand

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  ai-service-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: python -m pip install --requirement requirements.txt
      - run: python -m compileall -q .

  compose-config:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: goldeksa-ci
      POSTGRES_DB: goldeksa_ci
      POSTGRES_USER: goldeksa_ci
      POSTGRES_PASSWORD: ci-only-postgres-password
      RABBITMQ_DEFAULT_USER: goldeksa_ci
      RABBITMQ_DEFAULT_PASS: ci-only-rabbitmq-password
      JWT_SECRET: ci-only-jwt-secret-for-config-validation
      FRONTEND_URL: http://localhost:5174
      APP_BASE_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - name: Validate development compose
        run: docker compose config --quiet
      - name: Validate production-like compose
        run: docker compose -f infra/docker-compose.yml config --quiet

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, ai-service-check, compose-config]
    steps:
      - uses: actions/checkout@v4
      - name: Build development images
        run: docker compose build
