name: goldexa-e2e

# Isolated E2E stack. This file intentionally has no seed service and never
# points at the development/production database.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: goldeksa_e2e
      POSTGRES_USER: goldeksa_e2e
      POSTGRES_PASSWORD: goldeksa_e2e_only
    ports:
      - '55432:5432'
    volumes:
      - goldexa-e2e-postgres:/var/lib/postgresql/data
      - ../../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U goldeksa_e2e -d goldeksa_e2e']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  ai-service:
    build:
      context: ../../ai-service
      dockerfile: Dockerfile
    environment:
      AI_MODEL_DIR: /app/model_store
    ports:
      - '58000:8000'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      NODE_ENV: test
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: goldeksa_e2e
      DB_PASSWORD: goldeksa_e2e_only
      DB_DATABASE: goldeksa_e2e
    command: ['node', 'node_modules/typeorm/cli.js', '-d', 'dist/src/data-source.js', 'migration:run']
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      NODE_ENV: test
      PORT: 3001
      FRONTEND_URL: http://localhost:5174
      APP_BASE_URL: http://localhost:3011
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: goldeksa_e2e
      DB_PASSWORD: goldeksa_e2e_only
      DB_DATABASE: goldeksa_e2e
      CACHE_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: e2e-only-secret-at-least-32-characters-long
      JWT_EXPIRES_IN: 1h
      RETURN_OTP_IN_RESPONSE: 'true'
      E2E_ALLOW_DB_FIXTURES: '1'
      ZARINPAL_MERCHANT_ID: ''
      ZARINPAL_SANDBOX: 'true'
      GOLD_PRICE_SOURCE: mock
      AI_ENGINE_ENABLED: 'false'
      AI_LOCAL_URL: http://ai-service:8000
    ports:
      - '3011:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  goldexa-e2e-postgres:
