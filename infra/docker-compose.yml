name: ${COMPOSE_PROJECT_NAME:-goldexa}

# Production-like stack. Provide all required values through .env, an external
# secrets manager, or the deployment environment. Do not mount database/schema.sql
# or database/seed.sql here: schema.sql contains development fixtures. The target
# database must be provisioned by the deployment process before migrations run.

services:
  postgres:
    image: postgres:15-alpine
    container_name: goldeksa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: goldeksa-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: goldeksa-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER must be set}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend-migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: goldeksa-backend-migrate
    restart: "no"
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER must be set}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      DB_DATABASE: ${POSTGRES_DB:?POSTGRES_DB must be set}
    command: ["node", "node_modules/typeorm/cli.js", "-d", "dist/data-source.js", "migration:run"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: goldeksa-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL must be set}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER must be set}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      DB_DATABASE: ${POSTGRES_DB:?POSTGRES_DB must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: ${CACHE_DRIVER:-redis}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER must be set}:${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      GOLD_PRICE_SOURCE: ${GOLD_PRICE_SOURCE:-tgju}
      GOLD_PRICE_API_URL: ${GOLD_PRICE_API_URL:-}
      GOLD_PRICE_API_KEY: ${GOLD_PRICE_API_KEY:-}
      GOLD_PRICE_TGJU_DIVISOR: ${GOLD_PRICE_TGJU_DIVISOR:-10}
      PAYMENT_MODE: ${PAYMENT_MODE:?PAYMENT_MODE must be set}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-false}
      ZARINPAL_REFUND_ENDPOINT: ${ZARINPAL_REFUND_ENDPOINT:-}
      AI_ENGINE_ENABLED: ${AI_ENGINE_ENABLED:-false}
      AI_LOCAL_URL: ${AI_LOCAL_URL:-http://ai-service:8000}
      AI_LOCAL_TIMEOUT_MS: ${AI_LOCAL_TIMEOUT_MS:-8000}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    expose:
      - "3001"
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: goldeksa-frontend
    restart: unless-stopped
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:${FRONTEND_HOST_PORT:-5174}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -q '<!doctype html' || wget -qO- http://127.0.0.1/ | grep -q '<html'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: goldeksa-ai-service
    restart: unless-stopped
    environment:
      AI_MODEL_DIR: /app/model_store
    expose:
      - "8000"
    volumes:
      - ai-models:/app/model_store
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: goldeksa-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.0
    container_name: goldeksa-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  backend-uploads:
  prometheus-data:
  grafana-data:
  ai-models:
