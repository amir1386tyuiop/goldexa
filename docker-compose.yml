name: ${COMPOSE_PROJECT_NAME:-goldexa-dev}

# Development stack. Copy .env.example to .env before running:
#   docker compose up --build
# The database schema is development-only because database/schema.sql contains
# fixture rows. The seed service is idempotent and runs after migrations.

services:
  postgres:
    image: postgres:15-alpine
    container_name: goldeksa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: goldeksa-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: goldeksa-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER must be set}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: goldeksa-backend-migrate
    restart: "no"
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER must be set}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      DB_DATABASE: ${POSTGRES_DB:?POSTGRES_DB must be set}
    command: ["node", "node_modules/typeorm/cli.js", "-d", "dist/src/data-source.js", "migration:run"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: goldeksa-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5174}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3001}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER must be set}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      DB_DATABASE: ${POSTGRES_DB:?POSTGRES_DB must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER must be set}:${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      GOLD_PRICE_SOURCE: ${GOLD_PRICE_SOURCE:-mock}
      AI_ENGINE_ENABLED: ${AI_ENGINE_ENABLED:-false}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "${BACKEND_HOST_PORT:-3001}:3001"
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  seed:
    image: postgres:15-alpine
    container_name: goldeksa-development-seed
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGHOST: postgres
    volumes:
      - ./database/seed.sql:/seed/seed.sql:ro
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -ec
      - |
        seeded="$$(psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc "SELECT EXISTS (SELECT 1 FROM event_logs WHERE name = 'seed.completed')")"
        if [ "$$seeded" = "t" ]; then
          echo "Development seed already applied; skipping."
          exit 0
        fi
        psql -v ON_ERROR_STOP=1 --single-transaction -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -f /seed/seed.sql

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: goldeksa-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-5174}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -q '<!doctype html' || wget -qO- http://127.0.0.1/ | grep -q '<html'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: goldeksa-ai-service
    restart: unless-stopped
    ports:
      - "${AI_HOST_PORT:-8000}:8000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  backend-uploads:
